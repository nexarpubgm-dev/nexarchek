<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chek</title>
<style>
:root{--bg:#f2f2f7;--grp:#fff;--sep:#c6c6c8;--tx:#000;--mut:#8a8a8e;--seg:#7676801f;--segon:#fff;--ac:#d8171e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#000;--grp:#1c1c1e;--sep:#38383a;--tx:#fff;--mut:#8e8e93;--seg:#7676803d;--segon:#636366}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 48px;max-width:560px;margin:auto}
h1{font-size:34px;font-weight:700;letter-spacing:.3px;margin:8px 4px 16px}
.cap{color:var(--mut);font-size:13px;margin:18px 16px 7px;text-transform:uppercase}
.foot{color:var(--mut);font-size:13px;margin:7px 16px 0}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:none;color:var(--tx);font:inherit;font-size:13px;font-weight:500;padding:7px 2px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--segon);font-weight:600;box-shadow:0 3px 8px #0000001f,0 3px 1px #0000000a}
.grp{background:var(--grp);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row span{flex:0 0 auto;white-space:nowrap}
.row input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;text-align:right;padding:13px 0;outline:0}
.row input::placeholder{color:var(--mut);opacity:.7}
.row:focus-within{background:#7676800f}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-weight:600;padding:15px;margin-top:22px;cursor:pointer}
.btn:active{opacity:.7}
.btn.alt{background:var(--grp);color:var(--ac);margin-top:10px}
.err{color:#ff3b30;font-size:14px;margin:10px 16px 0;min-height:18px}
#out{margin-top:22px}
#out img{width:100%;height:auto;border-radius:16px;display:block;box-shadow:0 8px 30px #0000003d}
#lock{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;justify-content:center;padding:24px}
#lock>div{max-width:520px;width:100%;margin:auto}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="lock" hidden><div>
  <h1>Kirish</h1>
  <div class="grp"><label class="row"><span>PIN-kod</span><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"></label></div>
  <button class="btn" id="pinGo" type="button">Ochish</button>
  <div class="err" id="pinErr"></div>
</div></div>

<main>
  <h1>Chek</h1>
  <div class="seg" id="seg" role="group" aria-label="O'yin"></div>

  <div class="cap">Buyurtma</div>
  <div class="grp">
    <label class="row"><span>Xizmat</span><input id="svc" autocomplete="off" placeholder="Masalan: 660 UC"></label>
    <label class="row"><span>Narx</span><input id="price" inputmode="numeric" autocomplete="off" placeholder="Masalan: 150000"></label>
    <label class="row"><span>O'yinchi ID</span><input id="pid" inputmode="numeric" autocomplete="off" placeholder="Raqamlar"></label>
    <label class="row" id="zrow" hidden><span>Zone ID</span><input id="zone" inputmode="numeric" autocomplete="off" placeholder="Raqamlar"></label>
    <label class="row"><span>Buyurtma raqami</span><input id="order" autocomplete="off"></label>
  </div>
  <div class="err" id="err" role="alert"></div>
  <button class="btn" id="make" type="button">Chekni yaratish</button>

  <div id="out" hidden>
    <img id="img" alt="Tayyor chek">
    <button class="btn" id="share" type="button">Yuborish</button>
    <button class="btn alt" id="save" type="button">Rasmni saqlash</button>
    <div class="foot">Yuborish ishlamasa, rasmni bosib turing va «Saqlash»ni tanlang.</div>
  </div>
</main>

const $ = id => document.getElementById(id);
const FONT = 'system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif';
const fmt = n => Number(n).toLocaleString("ru-RU").replace(/\u00a0/g," ") + " " + CONFIG.CURRENCY;
const newOrder = () => "#" + Date.now().toString(36).slice(-5).toUpperCase();
let game = GAMES[0], lastBlob = null;

if (CONFIG.PIN) {
  $("lock").hidden = false;
  const go = () => { if ($("pin").value === CONFIG.PIN) $("lock").hidden = true; else $("pinErr").textContent = "PIN noto'g'ri."; };
  $("pinGo").onclick = go;
  $("pin").onkeydown = e => { if (e.key === "Enter") go(); };
}

function drawSeg(){
  $("seg").innerHTML = "";
  GAMES.forEach(g => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = g.label; b.setAttribute("aria-pressed", g === game);
    b.onclick = () => { game = g; drawSeg(); };
    $("seg").appendChild(b);
  });
  $("zrow").hidden = !game.zone;
}

const logo = new Image();
const logoReady = new Promise(res => { logo.onload = res; logo.onerror = res; });
logo.src = LOGO_SRC;

function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function fit(c,text,max,size,weight){
  let s = size; c.font = weight + " " + s + "px " + FONT;
  while (c.measureText(text).width > max && s > 16) { s -= 2; c.font = weight + " " + s + "px " + FONT; }
}
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes());
}

function render(rows){
  const cv = document.createElement("canvas"), c = cv.getContext("2d");
  const W = 900, rowH = 84, cardY = 560, cardH = rows.length*rowH;
  const H = cardY + cardH + 230;
  cv.width = W; cv.height = H;
  c.fillStyle = "#000"; c.fillRect(0,0,W,H);

  // logo
  if (logo.naturalWidth) {
    const k = Math.min(560/logo.naturalWidth, 250/logo.naturalHeight);
    const w = logo.naturalWidth*k, h = logo.naturalHeight*k;
    c.drawImage(logo, (W-w)/2, 70, w, h);
  }

  // yashil belgi
  c.fillStyle = "#34c759"; c.beginPath(); c.arc(W/2, 420, 46, 0, Math.PI*2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 9; c.lineCap = "round"; c.lineJoin = "round";
  c.beginPath(); c.moveTo(W/2-20, 422); c.lineTo(W/2-5, 438); c.lineTo(W/2+22, 403); c.stroke();

  c.textAlign = "center"; c.textBaseline = "alphabetic";
  c.fillStyle = "#fff"; c.font = "700 50px " + FONT; c.fillText("Donat tushdi", W/2, 520);

  // kartochka
  const cx = 50, cw = W - 100;
  c.fillStyle = "#1c1c1e"; rr(c, cx, cardY, cw, cardH, 30); c.fill();
  rows.forEach((r,i) => {
    const y = cardY + i*rowH + 53;
    c.textAlign = "left"; c.fillStyle = "#8e8e93"; c.font = "400 29px " + FONT; c.fillText(r[0], cx+36, y);
    c.textAlign = "right"; c.fillStyle = r[2] ? "#ff453a" : "#fff";
    fit(c, r[1], cw - 300, 33, r[2] ? "700" : "600"); c.fillText(r[1], cx+cw-36, y);
    if (i < rows.length-1) { c.fillStyle = "#38383a"; c.fillRect(cx+36, cardY + (i+1)*rowH, cw-36, 2); }
  });

  c.textAlign = "center"; c.fillStyle = "#fff"; c.font = "600 34px " + FONT;
  c.fillText("Xaridingiz uchun rahmat!", W/2, cardY + cardH + 95);
  c.fillStyle = "#d8171e"; c.font = "700 28px " + FONT;
  c.fillText(CONFIG.SHOP_NAME, W/2, cardY + cardH + 145);
  return cv;
}

$("make").onclick = async () => {
  const fail = m => { $("err").textContent = m; };
  try {
    const svc = $("svc").value.trim(), price = $("price").value.replace(/\D/g,""),
          pid = $("pid").value.trim(), zone = $("zone").value.trim();
    if (!svc) return fail("Xizmat nomini yozing.");
    if (!price) return fail("Narxni yozing.");
    if (!/^\d{5,15}$/.test(pid)) return fail("O'yinchi ID faqat raqam bo'lishi kerak (5–15 ta).");
    if (game.zone && !/^\d{2,6}$/.test(zone)) return fail("Zone ID yozing (faqat raqam).");
    $("err").textContent = "";
    await logoReady;
    const rows = [["O'yin", game.name], ["Xizmat", svc], ["O'yinchi ID", pid]];
    if (game.zone) rows.push(["Zone ID", zone]);
    rows.push(["Narx", fmt(price), true], ["Buyurtma", $("order").value.trim() || newOrder()], ["Sana", stamp()]);
    const cv = render(rows);
    $("img").src = cv.toDataURL("image/png");
    cv.toBlob(b => { lastBlob = b; }, "image/png");
    $("out").hidden = false;
    $("out").scrollIntoView({behavior:"smooth", block:"start"});
  } catch (e) {
    fail("Chek yaratilmadi: " + (e && e.message ? e.message : e));
  }
};

async function getBlob(){
  if (lastBlob) return lastBlob;
  const r = await fetch($("img").src); return await r.blob();
}
$("save").onclick = async () => {
  try {
    const b = await getBlob(), a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "chek-" + ($("order").value || "buyurtma").replace("#","") + ".png";
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { $("err").textContent = "Saqlanmadi. Rasmni bosib turing va «Saqlash»ni tanlang."; }
};
$("share").onclick = async () => {
  try {
    const b = await getBlob(), f = new File([b], "chek.png", {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f]});
    else $("save").click();
  } catch (e) { /* foydalanuvchi bekor qildi */ }
  $("order").value = newOrder();
};

$("order").value = newOrder();
drawSeg();
</script>
